<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus — Android App</title>
  
  <!-- Mobile Status Bar Color (Android) -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Mobile App Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body>

  <!-- Android Native Mobile Shell -->
  <div class="mobile-app-shell">

    <!-- ================= TOP SVG HEADER ARTWORK ================= -->
    <header class="top-svg-banner">
      <!-- Modern Multi-Layer Gradient Wave SVG Artwork -->
      <svg class="top-svg-graphic" viewBox="0 0 500 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#9333ea" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
          </linearGradient>
          <linearGradient id="headerGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Ambient Glow Orbs -->
        <circle cx="80" cy="60" r="100" fill="#6366f1" opacity="0.35" filter="url(#glow)" />
        <circle cx="420" cy="40" r="110" fill="#ec4899" opacity="0.3" filter="url(#glow)" />

        <!-- Deep Wave Back Layer -->
        <path d="M0,0 L500,0 L500,210 Q375,270 250,220 Q125,170 0,240 Z" fill="url(#headerGrad2)"></path>

        <!-- Dynamic Foreground Wave Layer -->
        <path d="M0,0 L500,0 L500,180 Q360,250 230,190 Q100,130 0,200 Z" fill="url(#headerGrad1)"></path>
      </svg>

      <!-- Branding Overlay -->
      <div class="top-art-overlay">
        <div class="app-brand-logo">
          <!-- Lightning / Nexus Glyph SVG -->
          <svg viewBox="0 0 24 24">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <h1 class="brand-app-name">Nexus</h1>
      </div>
    </header>

    <!-- ================= SCREEN 1: GOOGLE SIGN-IN ================= -->
    <main class="auth-body-container" id="authLoginSection">
      
      <!-- Glassmorphic Auth Card -->
      <div class="auth-glass-card">
        <h2 class="auth-headline">Welcome to Nexus</h2>
        <p class="auth-subtitle">Sign in with your Google account to access your personal dashboard & settings.</p>

        <!-- Official Google Sign-In Button -->
        <button id="googleSignInBtn" class="google-signin-btn">
          <!-- Official Google "G" SVG Icon -->
          <svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span class="google-btn-label">Continue with Google</span>
        </button>

        <!-- Security Badge -->
        <div class="security-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" />
          </svg>
          <span>Encrypted via Google OAuth 2.0</span>
        </div>
      </div>

      <!-- Footer Policy -->
      <footer class="auth-footer-terms">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </footer>
    </main>

    <!-- ================= SCREEN 2: AUTHENTICATED DASHBOARD ================= -->
    <section class="authenticated-dashboard" id="authenticatedDashboard">
      <div class="user-profile-hero">
        <img id="userAvatarImg" class="user-avatar-img" src="" alt="User Avatar" />
        <h2 id="userDisplayName" class="user-display-name">User Name</h2>
        <span id="userEmailText" class="user-email-text">user@gmail.com</span>
        <div>
          <span class="status-live-badge">✓ Google Account Connected</span>
        </div>
      </div>

      <button id="signOutBtn" class="signout-btn">Sign Out</button>
    </section>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js?v=1.0"></script>
</body>
</html>
