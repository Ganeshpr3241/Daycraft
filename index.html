<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Retro Chat — Android App</title>
  
  <!-- Mobile Status Bar Color (Android) -->
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="apple-touch-icon" href="./assets/logo.png">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>

  <!-- Android Mobile Shell Container -->
  <div class="mobile-app-shell">

    <!-- ================= TOP SVG HEADER ARTWORK ================= -->
    <header class="top-svg-banner">
      <!-- Clean, Professional Multi-Wave Gradient SVG Header -->
      <svg class="top-svg-graphic" viewBox="0 0 500 240" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="proGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#2563eb" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
          </linearGradient>
          <linearGradient id="proGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#1e40af" stop-opacity="0.4" />
          </linearGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="20" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Ambient Blue Light Glow -->
        <circle cx="250" cy="50" r="140" fill="#3b82f6" opacity="0.22" filter="url(#softGlow)" />

        <!-- Deep Base Curve -->
        <path d="M0,0 L500,0 L500,190 C380,240 260,150 0,210 Z" fill="url(#proGrad2)"></path>

        <!-- Dynamic Foreground Curve -->
        <path d="M0,0 L500,0 L500,155 C350,210 220,130 0,180 Z" fill="url(#proGrad1)"></path>
      </svg>

      <!-- App Branding Overlay -->
      <div class="top-art-overlay">
        <div class="app-brand-logo">
          <img src="assets/logo.png" alt="Retro Chat Logo" class="app-brand-logo-img" />
        </div>
        <h1 class="brand-app-name">Retro Chat</h1>
      </div>
    </header>

    <!-- ================= SCREEN 1: GOOGLE SIGN-IN ================= -->
    <main class="auth-body-container" id="authLoginSection">
      
      <!-- Glassmorphic Card -->
      <div class="auth-glass-card">
        <h2 class="auth-headline">Welcome to Retro Chat</h2>
        <p class="auth-subtitle">Sign in with your Google account to connect with friends and join private group channels.</p>

        <!-- Official Google Sign-In Button -->
        <button id="googleSignInBtn" class="google-signin-btn">
          <!-- Official Google "G" SVG Icon -->
          <svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span class="google-btn-label">Continue with Google</span>
        </button>

        <!-- Security Guarantee Badge -->
        <div class="security-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" />
          </svg>
          <span>Secured with Google OAuth 2.0</span>
        </div>
      </div>

      <!-- Footer Policy -->
      <footer class="auth-footer-terms">
        By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </footer>
    </main>

    <!-- ================= SCREEN 2: AUTHENTICATED DASHBOARD ================= -->
    <section class="authenticated-dashboard" id="authenticatedDashboard">
      <div class="user-profile-hero">
        <img id="userAvatarImg" class="user-avatar-img" src="" alt="User Avatar" />
        <h2 id="userDisplayName" class="user-display-name">User Name</h2>
        <span id="userEmailText" class="user-email-text">user@gmail.com</span>
        <div>
          <span class="status-live-badge">✓ Google Account Connected</span>
        </div>
      </div>

      <button id="signOutBtn" class="signout-btn">Sign Out</button>
    </section>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js?v=2.0"></script>
</body>
</html>
